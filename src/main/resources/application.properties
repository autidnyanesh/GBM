spring.application.name=gbm
server.port=${GBM_SERVER_PORT:8081}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=GBMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${GBM_DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${GBM_DB_USERNAME}
spring.datasource.password=${GBM_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info


